version: '3.8'

services:
  media-downloader:
    image: surajadev/media-downloader:latest
    container_name: media-downloader
    ports:
      - "8095:8095"
    environment:
      - TZ=Asia/Colombo
      # Optional: Override these if needed, otherwise uses defaults or internal config
      - QBITTORRENT_HOST=http://qbittorrent:8080
      - PROWLARR_URL=http://prowlarr:9696
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    depends_on:
      - qbittorrent
      - prowlarr
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000 # Use 'id -u' on Linux/Pi to check your UID
      - PGID=1000 # Use 'id -g' on Linux/Pi to check your GID
      - TZ=Asia/Colombo # Change to your timezone
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Colombo
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - ./downloads:/downloads
    ports:
      - 8080:8080 # Web UI port
      - 6881:6881 # Torrent communication (TCP)
      - 6881:6881/udp # Torrent communication (UDP)
    restart: unless-stopped

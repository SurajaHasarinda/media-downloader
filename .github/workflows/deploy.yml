name: Deploy to K3s

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

env:
  K3S_HOST: ${{ secrets.K3S_TAILSCALE_IP }}
  K3S_USER: ${{ secrets.K3S_USER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-deployer

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Substitute secrets into K8s manifests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          QBITTORRENT_USERNAME: ${{ secrets.QBITTORRENT_USERNAME }}
          QBITTORRENT_PASSWORD: ${{ secrets.QBITTORRENT_PASSWORD }}
        run: |
          envsubst < k8s/secret.yml > k8s/secret-rendered.yml

      - name: Copy manifests to K3s node
        run: |
          scp k8s/namespace.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/
          scp k8s/secret-rendered.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/secret.yml
          scp k8s/configmap.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/configmap.yml
          scp k8s/deployment.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/
          scp k8s/service.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/
          scp k8s/prowlarr.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/
          scp k8s/qbittorrent.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/

      - name: Deploy to K3s
        run: |
          ssh ${{ env.K3S_USER }}@${{ env.K3S_HOST }} << 'EOF'
            sudo k3s kubectl apply -f /tmp/namespace.yml
            sudo k3s kubectl apply -f /tmp/configmap.yml
            sudo k3s kubectl apply -f /tmp/secret.yml
            sudo k3s kubectl apply -f /tmp/prowlarr.yml
            sudo k3s kubectl apply -f /tmp/qbittorrent.yml
            sudo k3s kubectl apply -f /tmp/deployment.yml
            sudo k3s kubectl apply -f /tmp/service.yml

            # Force pull the latest images
            sudo k3s kubectl rollout restart deployment/prowlarr -n media-downloader
            sudo k3s kubectl rollout restart deployment/qbittorrent -n media-downloader
            sudo k3s kubectl rollout restart deployment/media-downloader -n media-downloader

            # Wait for rollouts to complete
            sudo k3s kubectl rollout status deployment/prowlarr -n media-downloader --timeout=120s
            sudo k3s kubectl rollout status deployment/qbittorrent -n media-downloader --timeout=120s
            sudo k3s kubectl rollout status deployment/media-downloader -n media-downloader --timeout=120s

            # Cleanup temp files
            rm -f /tmp/namespace.yml /tmp/configmap.yml /tmp/secret.yml /tmp/deployment.yml /tmp/service.yml /tmp/prowlarr.yml /tmp/qbittorrent.yml
          EOF
